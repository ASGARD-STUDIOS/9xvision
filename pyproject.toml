[project]
name = "ninexvision"
version = "0.4.0"
description = "Perception for AI agents: video, live camera/mic/screen and images. Scenes, UI flows, OCR, transcripts, sound, visual search, capture QA, faces, gestures, affect signals, OSC/WebSocket. Local, no API keys."
readme = "README.md"
license = "MIT"
authors = [{ name = "Koto Murai" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.1",
    "mcp>=1.2",
    "yt-dlp>=2025.1.1",
    "ocrmac>=1.0; sys_platform == 'darwin'",
    "onnxruntime>=1.24.3",
    "tokenizers>=0.23.3",
    "websockets>=13",
]

[project.scripts]
9xvision = "ninexvision.cli:main"
9xvision-mcp = "ninexvision.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
